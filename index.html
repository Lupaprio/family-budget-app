<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kostenbuch Familie Mueller</title><style>:root{--p:#241773;--b:#0080c6;--g:#ffc20e;--bg:#f4f3f8;--mut:#665f72;--ln:#ded9e8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px system-ui;color:#151321}main{max-width:1000px;margin:auto;padding:12px}.card{background:#fff;border:1px solid var(--ln);border-top:3px solid var(--p);border-radius:14px;padding:15px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mut{color:var(--mut)}h1{color:var(--p);margin:4px 0}button,input,select{font:inherit;border:1px solid var(--ln);border-radius:10px;padding:12px}.pri{background:var(--p);color:white;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.bar{height:14px;background:#e5e7eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--p),var(--b))}.modal{position:fixed;inset:0;background:#0009;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px}.modal[hidden]{display:none}.box{position:relative;width:min(430px,100%);background:white;border-top:4px solid var(--p);border-radius:18px;padding:20px}.box input,.box select,.box .pri{width:100%;margin-top:10px;min-height:50px;font-size:17px}.x{position:absolute;right:8px;top:5px;border:0;background:transparent;font-size:30px}.trend{height:120px;display:flex;align-items:flex-end;gap:3px;border-bottom:1px solid var(--ln)}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}main{padding:9px}.row{flex-direction:column;align-items:stretch}.modal{align-items:flex-start}.box{margin-top:7vh}}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body>
<div id="login" class="modal"><div class="box"><h2>Anmelden</h2><div class="mut">Einmal pro Smartphone anmelden.</div><input id="email" type="email" placeholder="E-Mail"><input id="pw" type="password" placeholder="Passwort"><button id="signin" class="pri">Anmelden</button><div id="ls" class="mut"></div></div></div>
<div id="bookModal" class="modal" hidden><div class="box"><button id="close" class="x">×</button><h2>Ausgabe buchen</h2><input id="amount" inputmode="decimal" placeholder="0,00 €"><select id="cat"><option>Lebensmittel</option><option>Baumarkt</option><option>Kind</option><option>Haus</option><option>Bekleidung</option><option>Autos</option></select><button id="book" class="pri">Buchen</button><div id="st" class="mut"></div></div></div>
<main><h1>Kostenbuch Familie Müller</h1><button id="open" class="pri">+ Ausgabe buchen</button><div class="grid"><div class="card"><div class="mut">Gesamtkosten</div><h2 id="total">0,00 €</h2></div><div class="card"><div class="mut">Ø Kosten</div><h2 id="avg">0,00 €</h2><small>Letzte 12 Monate</small></div></div><div class="card"><h2>Kostenentwicklung - 12 Monate</h2><div id="trend" class="trend"></div></div><div class="card"><div class="row"><h2>Monatliche Kosten nach Kategorie</h2><input id="month" type="month"></div><div id="cats"></div></div><div class="card"><button id="export" class="pri">Nach Excel exportieren</button></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://tvffoossrhaydbkebbtk.supabase.co','sb_publishable_1f4A48Zj-6jFwmWP_HhlPA_3h2Fi1pY'),$=x=>document.getElementById(x),eur=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'});let rows=[];const today=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};function show(){$('bookModal').hidden=false;setTimeout(()=>$('amount').focus(),50)}function hide(){$('bookModal').hidden=true;$('st').textContent=''}async function load(){let {data,error}=await db.from('bookings').select('amount,category,booking_date').order('booking_date');if(error){$('st').textContent=error.message;return}rows=(data||[]).map(x=>({a:+x.amount,c:x.category,d:x.booking_date}));render()}function render(){let cur=today().slice(0,7),sel=$('month').value;$('total').textContent=eur.format(rows.filter(x=>x.d.startsWith(cur)).reduce((s,x)=>s+x.a,0));let now=new Date(),ms=[];for(let i=11;i>=0;i--){let d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'))}let vs=ms.map(m=>rows.filter(x=>x.d.startsWith(m)).reduce((s,x)=>s+x.a,0)),mx=Math.max(...vs,1),nm=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];$('avg').textContent=eur.format(vs.reduce((a,b)=>a+b,0)/12);$('trend').innerHTML=ms.map((m,i)=>`<div style="flex:1;text-align:center"><div class="fill" style="height:${vs[i]/mx*90}px;min-height:${vs[i]?3:0}px"></div><small>${nm[+m.slice(5)-1]}</small></div>`).join('');let cs=['Lebensmittel','Baumarkt','Kind','Haus','Bekleidung','Autos'],s=Object.fromEntries(cs.map(c=>[c,0]));rows.filter(x=>x.d.startsWith(sel)).forEach(x=>s[x.c]+=x.a);let cm=Math.max(...Object.values(s),1);$('cats').innerHTML=cs.map(c=>`<div style="margin:14px 0"><div class="row"><b>${c}</b><b>${eur.format(s[c])}</b></div><div class="bar"><div class="fill" style="width:${s[c]/cm*100}%"></div></div></div>`).join('')}$('signin').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});if(error){$('ls').textContent='Anmeldung fehlgeschlagen: '+error.message;return}$('login').hidden=true;await load();show()};$('open').onclick=show;$('close').onclick=hide;$('book').onclick=async()=>{let a=Number($('amount').value.trim().replace(',','.'));if(!Number.isFinite(a)||a<=0){$('st').textContent='Bitte gültigen Betrag eingeben.';return}let {data:{user}}=await db.auth.getUser(),{error}=await db.from('bookings').insert({user_id:user.id,amount:a,category:$('cat').value,booking_date:today()});if(error){$('st').textContent='Buchung fehlgeschlagen: '+error.message;return}$('st').textContent='✓ Buchung gespeichert.';$('amount').value='';await load();setTimeout(hide,450)};$('month').value=today().slice(0,7);$('month').onchange=render;$('export').onclick=()=>{let r=[['Datum','Kategorie','Betrag'],...rows.map(x=>[x.d,x.c,x.a.toFixed(2).replace('.',',')])],csv=r.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\n'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'})),a=document.createElement('a');a.href=u;a.download='Kostenbuch.csv';a.click()};db.auth.getSession().then(async({data:{session}})=>{if(session){$('login').hidden=true;await load();show()}});
</script></body></html>
